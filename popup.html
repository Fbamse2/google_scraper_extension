<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Image Vault</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{
    --bg:#fafafa;
    --surface:#ffffff;
    --border:#e8e8e8;
    --text:#1a1a1a;
    --text-muted:#737373;
    --text-subtle:#a3a3a3;
    --accent:#0067c0;
    --accent-light:rgba(0,103,192,.06);
    --success:#10b981;
    --danger:#ef4444;
    --radius:6px;
    --shadow:0 1px 3px rgba(0,0,0,.05);
  }
  body{width:380px;background:var(--bg);color:var(--text);font-family:'Inter',system-ui,sans-serif;font-size:13px;line-height:1.5;position:relative;overflow-x:hidden}
  .wrap{padding:0}
  
  /* ---------- header ---------- */
  .hd{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--border);background:var(--surface)}
  .lens{width:32px;height:32px;flex:none;border-radius:6px;background:var(--accent);display:grid;place-items:center}
  .lens span{width:12px;height:12px;border-radius:50%;background:#fff}
  .ttl{flex:1;min-width:0}
  h1{font-weight:600;font-size:15px;color:var(--text)}
  h1 b{color:var(--accent);font-weight:inherit}
  .statusline{display:flex;align-items:center;gap:6px;margin-top:3px;font-size:11px;color:var(--text-muted)}
  .dot{width:5px;height:5px;border-radius:50%;background:var(--text-subtle)}
  .dot.on{background:var(--success)}
  .count-chip{font-size:11px;font-weight:500;color:var(--text-muted);background:var(--bg);padding:3px 8px;border-radius:4px}
  .count-chip b{color:var(--text);font-size:13px}
  
  /* ---------- main content area ---------- */
  .main-content{padding:14px;display:flex;flex-direction:column;gap:12px}
  
  /* ---------- buttons ---------- */
  button{font-family:'Inter',sans-serif;font-weight:500;color:var(--text);background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);cursor:pointer;transition:all .15s;font-size:13px;padding:8px 12px}
  button:hover{background:#f5f5f5;border-color:#d4d4d4}
  button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
  .fetch-btn{display:block;width:100%;padding:10px;background:var(--accent);border:none;color:#fff;font-weight:500}
  .fetch-btn:hover{background:#005a9e}
  .fetch-btn.working{opacity:.8;pointer-events:none}
  
  /* ---------- quick actions ---------- */
  .quick{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
  .quick button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 4px;font-size:11px}
  .quick button span{font-size:9px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.3px}
  .quick button.danger{color:var(--danger)}
  .quick button.danger:hover{background:rgba(239,68,68,.08)}
  
  /* ---------- controls drawer ---------- */
  .controls{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
  .controls-toggle{width:100%;display:flex;align-items:center;justify-content:space-between;padding:10px 12px;font-size:12px;font-weight:500;background:transparent;border:none;text-align:left;color:var(--text)}
  .controls-toggle:hover{background:#f5f5f5}
  .controls-toggle .arr{transition:transform .2s;font-size:9px;color:var(--text-subtle)}
  .controls-toggle.active .arr{transform:rotate(180deg)}
  .controls-panel{max-height:0;overflow:hidden;transition:max-height .3s}
  .controls-panel.open{max-height:350px}
  .ctl-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:6px 12px 12px}
  .ctl{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 10px;border:1px solid var(--border);border-radius:var(--radius);background:var(--bg);cursor:pointer}
  .ctl:hover{border-color:#d4d4d4}
  .ctl span{font-size:11px;font-weight:500}
  .ctl span em{display:block;font-size:9px;font-style:normal;color:var(--text-subtle);margin-top:1px}
  .ctl input{display:none}
  .sw{flex:none;width:34px;height:18px;border-radius:9px;background:#e5e5e5;position:relative;transition:background .2s}
  .sw::after{content:'';position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 2px rgba(0,0,0,.15)}
  .ctl input:checked + .sw{background:var(--accent)}
  .ctl input:checked + .sw::after{transform:translateX(16px)}
  
  /* ---------- recent list ---------- */
  .recent{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:12px}
  .recent-hd{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
  .lbl{font-size:10px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:.5px}
  #searchInput{width:120px;background:var(--bg);border:1px solid var(--border);color:var(--text);border-radius:var(--radius);padding:6px 10px;font-size:11px}
  #searchInput:focus{outline:none;border-color:var(--accent)}
  #content{max-height:200px;overflow-y:auto}
  .row{display:flex;align-items:center;gap:8px;padding:8px;border-radius:var(--radius);margin-bottom:4px;transition:all .15s}
  .row:hover{background:#f5f5f5}
  .thumb{flex:none;width:40px;height:40px;border-radius:4px;overflow:hidden;background:#f0f0f0;border:1px solid var(--border);cursor:zoom-in}
  .thumb img{width:100%;height:100%;object-fit:cover}
  .meta{flex:1;min-width:0}
  .url{display:block;font-size:11px;color:var(--text);text-decoration:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .url:hover{color:var(--accent)}
  .sub{display:flex;align-items:center;gap:4px;margin-top:2px}
  .host{font-size:9px;color:var(--text-subtle);text-transform:uppercase}
  .gif-tag{font-size:8px;color:var(--danger);border:1px solid rgba(239,68,68,.3);background:rgba(239,68,68,.06);border-radius:3px;padding:1px 4px;font-weight:600}
  .acts{display:flex;gap:3px;flex:none;opacity:0;transition:opacity .15s}
  .row:hover .acts{opacity:1}
  .acts button{width:24px;height:24px;padding:0;font-size:10px;border-radius:4px}
  .empty{text-align:center;color:var(--text-muted);padding:24px 10px;border:1px dashed var(--border);border-radius:var(--radius);font-size:11px;background:var(--bg)}
  .empty .big{font-size:24px;display:block;margin-bottom:6px}
  
  /* ---------- footer ---------- */
  .library-btn{display:block;width:100%;padding:10px;background:transparent;border:1px solid var(--border);color:var(--text-muted);font-weight:500;border-radius:var(--radius);text-align:center}
  .library-btn:hover{background:#f5f5f5;color:var(--text)}
  
  /* ---------- toast ---------- */
  .toast{position:fixed;left:50%;bottom:12px;transform:translateX(-50%) translateY(60px);z-index:60;display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:10px 14px;box-shadow:0 4px 12px rgba(0,0,0,.1);transition:all .2s;opacity:0;pointer-events:none}
  .toast.show{transform:translateX(-50%) translateY(0);opacity:1;pointer-events:auto}
  #toastMsg{font-size:12px;font-weight:500;color:var(--text)}
  #toastUndo{font-size:11px;padding:4px 10px;color:var(--accent);border-color:var(--accent);background:transparent}
  #toastUndo:hover{background:var(--accent-light)}
  
  /* ---------- scrollbar ---------- */
  ::-webkit-scrollbar{width:6px}
  ::-webkit-scrollbar-track{background:transparent}
  ::-webkit-scrollbar-thumb{background:#e5e5e5;border-radius:3px}
  ::-webkit-scrollbar-thumb:hover{background:#d4d4d4}
  
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
  <div class="wrap">
    <header class="hd">
      <div class="lens" aria-hidden="true"><span></span></div>
      <div class="ttl">
        <h1>Image <b>Vault</b></h1>
        <div class="statusline">
          <span class="dot" id="autoDot"></span><span id="autoLabel">Manual</span>
          <span class="sep">·</span>
          <span id="storageChip">💾 …</span>
        </div>
      </div>
      <span class="count-chip" id="count"><b id="countNum">0</b><i>URLs</i></span>
    </header>

    <button id="fetch" class="fetch-btn">⛏ Fetch from Page</button>

    <div class="quick">
      <button id="copyAll" title="Copy all page URLs">📋<span>Copy All</span></button>
      <button id="copyMd" title="Copy as Markdown embeds">Ⓜ<span>Markdown</span></button>
      <button id="saveTxt" title="Download as .txt">💾<span>.txt</span></button>
      <button id="clear" class="danger" title="Clear the library">✕<span>Clear</span></button>
    </div>

    <div class="controls">
      <button id="controlsBtn" class="controls-toggle">⚙ Controls <span class="arr">▼</span></button>
      <div id="controlsPanel" class="controls-panel">
        <div class="ctl-grid">
          <label class="ctl"><span>Hover scan<em>Needed for Google</em></span><input type="checkbox" id="hoverToggle"><i class="sw"></i></label>
          <label class="ctl"><span>Data-tolns only<em>Strict filter</em></span><input type="checkbox" id="tolnsToggle"><i class="sw"></i></label>
          <label class="ctl"><span>Auto-capture<em>Every second</em></span><input type="checkbox" id="autoCaptureToggle"><i class="sw"></i></label>
          <label class="ctl"><span>Auto-folder<em>By search query</em></span><input type="checkbox" id="autoFolderToggle"><i class="sw"></i></label>
          <label class="ctl"><span>Hide list<em>Compact popup</em></span><input type="checkbox" id="hidePreviewsToggle"><i class="sw"></i></label>
          <label class="ctl"><span>Highlight saved<em>Green outline on page</em></span><input type="checkbox" id="highlightToggle"><i class="sw"></i></label>
        </div>
      </div>
    </div>

    <section id="listSection" class="recent">
      <div class="recent-hd">
        <span class="lbl">Recent <b id="recentCount">0</b></span>
        <input id="searchInput" type="text" placeholder="⌕ Filter…">
      </div>
      <div id="content"></div>
    </section>

    <button id="openGrid" class="library-btn">📚 Open Full Library</button>
  </div>

  <div id="toast" class="toast">
    <span id="toastMsg"></span>
    <button id="toastUndo">↩ Undo</button>
  </div>

  <script src="shared.js"></script>
  <script src="popup.js"></script>
</body>
</html>
