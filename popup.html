<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Image Vault</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=IBM+Plex+Mono:wght@400;600;700&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{--bg:#15120e;--surface:#1e1914;--surface2:#262019;--line:#33291f;--line2:#43362a;--ink:#f0e8db;--muted:#9c8e79;--faint:#6b5f4f;--amber:#f5a83c;--amber2:#ffc061;--cyan:#63d8cf;--red:#e05c4f;--green:#7bc47f;}
  body{width:384px;background:radial-gradient(480px 220px at 95% -15%, rgba(245,168,60,.14), transparent 60%),radial-gradient(400px 200px at -15% 115%, rgba(99,216,207,.07), transparent 60%),var(--bg);color:var(--ink);font-family:'Space Grotesk',system-ui,sans-serif;font-size:13px;position:relative;overflow-x:hidden}
  body::before{content:'';position:fixed;top:0;left:0;right:0;height:2px;z-index:50;pointer-events:none;background:linear-gradient(90deg,var(--amber),rgba(245,168,60,0) 75%)}
  .grain{position:fixed;inset:0;z-index:40;pointer-events:none;opacity:.05;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2'/></filter><rect width='140' height='140' filter='url(%23n)'/></svg>")}
  .filmstrip{height:9px;border-bottom:1px solid #000;opacity:.5;background:#0b0906 radial-gradient(2.5px 2.5px at 9px 50%, rgba(239,231,218,.2) 97%, transparent 100%) repeat-x;background-size:20px 100%}
  .wrap{padding:13px 14px 15px}
  button{font-family:'IBM Plex Mono',monospace;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--ink);background:var(--surface2);border:1px solid var(--line2);border-radius:6px;cursor:pointer;transition:transform .15s,border-color .15s,background .15s,box-shadow .15s,color .15s}
  button:hover{transform:translateY(-1px);border-color:rgba(245,168,60,.6);box-shadow:0 5px 14px rgba(0,0,0,.35)}
  button:active{transform:translateY(0) scale(.97)}
  button:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
  /* ---------- header ---------- */
  .hd{display:flex;align-items:center;gap:11px;margin-bottom:12px}
  .lens{width:34px;height:34px;flex:none;border-radius:8px;border:2px solid var(--amber);display:grid;place-items:center;background:rgba(245,168,60,.07);box-shadow:0 0 18px rgba(245,168,60,.16), inset 0 0 10px rgba(245,168,60,.08)}
  .lens span{width:12px;height:12px;border-radius:50%;background:radial-gradient(circle at 35% 35%, var(--amber2), var(--amber) 60%, #8a5a17);animation:lensPulse 3.2s ease-in-out infinite}
  @keyframes lensPulse{0%,100%{transform:scale(1)}50%{transform:scale(.78)}}
  .ttl{flex:1;min-width:0}
  h1{font-family:'Archivo Black',Impact,sans-serif;font-size:16px;letter-spacing:.02em;line-height:1}
  h1 b{color:var(--amber);font-weight:inherit}
  .statusline{display:flex;align-items:center;gap:6px;margin-top:5px;font:600 8.5px 'IBM Plex Mono',monospace;letter-spacing:.12em;color:var(--muted);text-transform:uppercase}
  .statusline .sep{color:var(--faint)}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--faint);flex:none;transition:background .2s}
  .dot.on{background:var(--green);animation:dotPulse 1.6s ease-out infinite}
  @keyframes dotPulse{0%{box-shadow:0 0 0 0 rgba(123,196,127,.5)}70%{box-shadow:0 0 0 6px rgba(123,196,127,0)}100%{box-shadow:0 0 0 0 rgba(123,196,127,0)}}
  .count-chip{flex:none;text-align:center;border:1px solid rgba(245,168,60,.45);border-radius:8px;padding:5px 11px;background:rgba(245,168,60,.06)}
  .count-chip b{display:block;font-family:'Archivo Black',Impact,sans-serif;font-size:17px;color:var(--amber2);line-height:1}
  .count-chip i{display:block;font:600 7.5px 'IBM Plex Mono',monospace;font-style:normal;letter-spacing:.22em;color:var(--muted);margin-top:2px;text-transform:uppercase}
  .count-chip.tick{animation:chipTick .35s cubic-bezier(.2,.85,.3,1.3)}
  @keyframes chipTick{0%{transform:scale(1)}40%{transform:scale(1.14)}100%{transform:scale(1)}}
  /* ---------- actions ---------- */
  .fetch-btn{display:block;width:100%;padding:12px;font-size:12px;background:linear-gradient(180deg,var(--amber2),var(--amber));border-color:var(--amber);color:#221503;text-shadow:0 1px 0 rgba(255,255,255,.25)}
  .fetch-btn:hover{box-shadow:0 6px 20px rgba(245,168,60,.35)}
  .fetch-btn.working{animation:workPulse 1.1s ease-in-out infinite;pointer-events:none}
  @keyframes workPulse{0%,100%{box-shadow:0 0 0 0 rgba(245,168,60,.4)}50%{box-shadow:0 0 0 7px rgba(245,168,60,0)}}
  .fetch-btn.success{background:linear-gradient(180deg,#93d69e,#5fae6d);border-color:#5fae6d;color:#0c1f10;text-shadow:none}
  .quick{display:flex;gap:6px;margin-top:8px}
  .quick button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 4px;font-size:13px;line-height:1}
  .quick button span{font-size:8px;letter-spacing:.1em;color:var(--muted)}
  .quick button:hover span{color:var(--amber2)}
  .quick button.danger{color:#f0a79e;border-color:rgba(224,92,79,.4)}
  .quick button.danger span{color:#b9837c}
  .quick button.danger:hover{border-color:var(--red);color:#fff;background:rgba(224,92,79,.14)}
  .quick button.danger.armed{background:rgba(224,92,79,.22);border-color:var(--red);color:#ffb4ab;animation:workPulse 1s ease-in-out infinite}
  /* ---------- controls drawer ---------- */
  .controls{margin-top:11px}
  .controls-toggle{width:100%;display:flex;align-items:center;justify-content:space-between;padding:8px 11px;font-size:9.5px;background:var(--surface);border-color:var(--line)}
  .controls-toggle:hover{border-color:rgba(245,168,60,.5)}
  .controls-toggle.active{border-color:var(--amber);color:var(--amber2)}
  .controls-toggle .arr{transition:transform .25s}
  .controls-toggle.active .arr{transform:rotate(180deg)}
  .controls-panel{max-height:0;overflow:hidden;transition:max-height .3s cubic-bezier(.2,.8,.3,1)}
  .controls-panel.open{max-height:280px}
  .ctl-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:8px 0 2px}
  .ctl{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 10px;border:1px solid var(--line);border-radius:7px;background:var(--surface);cursor:pointer;transition:border-color .15s,background .15s}
  .ctl:hover{border-color:rgba(245,168,60,.45);background:var(--surface2)}
  .ctl span{font-size:11px;font-weight:500;line-height:1.25}
  .ctl span em{display:block;font:500 8px 'IBM Plex Mono',monospace;font-style:normal;letter-spacing:.05em;color:var(--faint);margin-top:2px;text-transform:uppercase}
  .ctl input{display:none}
  .sw{flex:none;width:30px;height:17px;border-radius:9px;background:#3a3128;position:relative;transition:background .2s}
  .sw::after{content:'';position:absolute;top:2px;left:2px;width:13px;height:13px;border-radius:50%;background:var(--muted);transition:transform .2s cubic-bezier(.2,.8,.3,1.3),background .2s}
  .ctl input:checked + .sw{background:var(--amber)}
  .ctl input:checked + .sw::after{transform:translateX(13px);background:#221503}
  /* ---------- recent list ---------- */
  .recent{margin-top:12px}
  .recent-hd{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:7px}
  .lbl{font:700 9px 'IBM Plex Mono',monospace;letter-spacing:.22em;color:var(--muted);text-transform:uppercase}
  .lbl b{color:var(--amber2)}
  #searchInput{width:130px;background:#120e0a;border:1px solid var(--line2);color:var(--ink);border-radius:6px;padding:5px 9px;font:400 10.5px 'IBM Plex Mono',monospace;transition:border-color .15s,box-shadow .15s}
  #searchInput:focus{outline:none;border-color:var(--amber);box-shadow:0 0 0 3px rgba(245,168,60,.18)}
  #searchInput::placeholder{color:var(--faint)}
  #content{max-height:196px;overflow-y:auto;padding-right:3px}
  .row{display:flex;align-items:center;gap:9px;padding:6px 8px;border:1px solid var(--line);border-left:3px solid transparent;border-radius:7px;background:var(--surface);margin-bottom:5px;transition:border-color .15s,background .15s,transform .15s;animation:rowIn .32s both}
  .row:hover{border-left-color:var(--amber);background:var(--surface2);transform:translateX(2px)}
  @keyframes rowIn{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
  .thumb{flex:none;width:42px;height:42px;border-radius:6px;overflow:hidden;background:#0b0906;border:1px solid var(--line2);cursor:zoom-in}
  .thumb img{width:100%;height:100%;object-fit:cover;transition:transform .3s}
  .row:hover .thumb img{transform:scale(1.18)}
  .meta{flex:1;min-width:0}
  .url{display:block;font:400 9.5px/1.35 'IBM Plex Mono',monospace;color:var(--ink);text-decoration:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .url:hover{color:var(--amber)}
  .sub{display:flex;align-items:center;gap:5px;margin-top:3px}
  .host{font:600 8px 'IBM Plex Mono',monospace;letter-spacing:.07em;color:var(--faint);text-transform:uppercase}
  .gif-tag{font:700 7.5px 'IBM Plex Mono',monospace;letter-spacing:.12em;color:#ffd7d2;border:1px solid rgba(224,92,79,.5);background:rgba(224,92,79,.14);border-radius:3px;padding:1px 4px}
  .acts{display:flex;gap:4px;flex:none;opacity:0;transform:translateX(5px);transition:opacity .18s,transform .18s}
  .row:hover .acts{opacity:1;transform:none}
  .acts button{width:25px;height:25px;padding:0;font-size:11px;line-height:1;border-radius:5px}
  .empty{text-align:center;color:var(--muted);padding:20px 10px;border:1px dashed var(--line2);border-radius:8px;font-size:11.5px}
  .empty .big{font-size:26px;display:block;margin-bottom:6px}
  /* ---------- footer ---------- */
  .library-btn{display:block;width:100%;margin-top:11px;padding:10px;font-size:10.5px;background:transparent;border:1px solid rgba(99,216,207,.55);color:var(--cyan)}
  .library-btn:hover{background:rgba(99,216,207,.12);box-shadow:0 0 18px rgba(99,216,207,.22);border-color:var(--cyan)}
  /* ---------- toast ---------- */
  .toast{position:fixed;left:50%;bottom:12px;transform:translateX(-50%) translateY(60px);z-index:60;display:flex;align-items:center;gap:12px;background:var(--surface2);border:1px solid rgba(245,168,60,.55);border-radius:8px;padding:9px 14px;box-shadow:0 12px 32px rgba(0,0,0,.55);transition:transform .3s cubic-bezier(.2,.85,.3,1.2),opacity .3s;opacity:0;pointer-events:none}
  .toast.show{transform:translateX(-50%) translateY(0);opacity:1;pointer-events:auto}
  #toastMsg{font:600 10px 'IBM Plex Mono',monospace;letter-spacing:.05em;color:var(--ink);white-space:nowrap}
  #toastUndo{font-size:9px;padding:4px 9px;color:var(--amber2);border-color:var(--amber)}
  ::-webkit-scrollbar{width:8px}
  ::-webkit-scrollbar-track{background:var(--bg)}
  ::-webkit-scrollbar-thumb{background:#3a3128;border-radius:4px;border:2px solid var(--bg)}
  ::-webkit-scrollbar-thumb:hover{background:rgba(245,168,60,.55)}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
  <div class="grain"></div>
  <div class="filmstrip"></div>

  <div class="wrap">
    <header class="hd">
      <div class="lens" aria-hidden="true"><span></span></div>
      <div class="ttl">
        <h1>IMAGE <b>VAULT</b></h1>
        <div class="statusline">
          <span class="dot" id="autoDot"></span><span id="autoLabel">manual</span>
          <span class="sep">·</span>
          <span id="storageChip">💽 …</span>
        </div>
      </div>
      <span class="count-chip" id="count"><b id="countNum">0</b><i>urls</i></span>
    </header>

    <button id="fetch" class="fetch-btn">⛏ Fetch from Page</button>

    <div class="quick">
      <button id="copyAll" title="Copy all page URLs">📋<span>Copy All</span></button>
      <button id="copyMd" title="Copy as Markdown embeds">Ⓜ<span>Markdown</span></button>
      <button id="saveTxt" title="Download as .txt">💾<span>.txt</span></button>
      <button id="clear" class="danger" title="Clear the library">✕<span>Clear</span></button>
    </div>

    <div class="controls">
      <button id="controlsBtn" class="controls-toggle">⚙ Controls <span class="arr">▾</span></button>
      <div id="controlsPanel" class="controls-panel">
        <div class="ctl-grid">
          <label class="ctl"><span>Hover scan<em>needed for google</em></span><input type="checkbox" id="hoverToggle"><i class="sw"></i></label>
          <label class="ctl"><span>data-tolns only<em>strict filter</em></span><input type="checkbox" id="tolnsToggle"><i class="sw"></i></label>
          <label class="ctl"><span>Auto-capture<em>every second</em></span><input type="checkbox" id="autoCaptureToggle"><i class="sw"></i></label>
          <label class="ctl"><span>Auto-folder<em>by search query</em></span><input type="checkbox" id="autoFolderToggle"><i class="sw"></i></label>
          <label class="ctl"><span>Hide list<em>compact popup</em></span><input type="checkbox" id="hidePreviewsToggle"><i class="sw"></i></label>
          <label class="ctl"><span>Highlight saved<em>green outline on page</em></span><input type="checkbox" id="highlightToggle"><i class="sw"></i></label>
        </div>
      </div>
    </div>

    <section id="listSection" class="recent">
      <div class="recent-hd">
        <span class="lbl">Recent <b id="recentCount">0</b></span>
        <input id="searchInput" type="text" placeholder="⌕ filter…">
      </div>
      <div id="content"></div>
    </section>

    <button id="openGrid" class="library-btn">📚 Open Full Library</button>
  </div>

  <div id="toast" class="toast">
    <span id="toastMsg"></span>
    <button id="toastUndo">↩ Undo</button>
  </div>

  <script src="shared.js"></script>
  <script src="popup.js"></script>
</body>
</html>
